name: Deploy to Production (dev branch)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory for SQLite
        run: mkdir -p data

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Public / non-sensitive — hardcoded so missing secrets don't become ''
          NEXT_PUBLIC_SITE_URL: https://heartinmotionhk.com
          NEXT_PUBLIC_SITE_URL_PROD: https://heartinmotionhk.com
          NEXT_PUBLIC_DOMAIN: heartinmotionhk.com
          NEXT_PUBLIC_DOMAIN_PROD: heartinmotionhk.com
          NEXT_PUBLIC_MEDIA_URL: /media
          PAYLOAD_PUBLIC_SERVER_URL: https://heartinmotionhk.com
          MAINTENANCE_MODE: "false"
          DATABASE_URL: file:./data/payload.db
          # Secrets
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Package build artifacts
        run: tar -czf next-build.tar.gz .next

      - name: Upload build artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "next-build.tar.gz"
          target: "/home/deploy/dev/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/deploy/dev

            echo "--- Pulling latest code from dev ---"
            git stash
            git pull origin dev

            echo "--- Installing dependencies ---"
            npm install --production=false --ignore-scripts

            echo "--- Running DB migrations ---"
            NODE_OPTIONS='--import tsx --max-old-space-size=256' npm run migrate \
              || echo "WARNING: migrations failed (likely OOM) — run manually: NODE_OPTIONS='--import tsx' npm run migrate"

            echo "--- Deploying build artifacts ---"
            rm -rf .next
            tar -xzf next-build.tar.gz
            rm -f next-build.tar.gz

            echo "--- Restarting PM2 ---"
            pm2 start ecosystem.config.js --only heartinmotionhk-dev || pm2 restart heartinmotionhk-dev --update-env

            echo "--- Deploy complete ---"
            pm2 status
