name: Deploy to Production (dev branch)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/deploy/dev

            echo "--- Pulling latest code from dev ---"
            git stash
            git pull origin dev

            echo "--- Installing dependencies ---"
            npm install --production=false --ignore-scripts

            echo "--- Generating Payload types & importmap ---"
            NODE_OPTIONS='--import tsx --max-old-space-size=512' npx payload generate:types
            NODE_OPTIONS='--import tsx --max-old-space-size=512' npx payload generate:importmap

            echo "--- Running DB migrations ---"
            NODE_OPTIONS='--import tsx' npm run migrate

            echo "--- Building ---"
            rm -rf .next
            npm run build

            echo "--- Restarting PM2 ---"
            pm2 start ecosystem.config.js --only heartinmotionhk-dev || pm2 restart heartinmotionhk-dev --update-env

            echo "--- Deploy complete ---"
            pm2 status
